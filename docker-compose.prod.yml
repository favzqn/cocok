# Production-shaped local stack (docker compose -f docker-compose.prod.yml up -d --build)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cocok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cocok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cocok:${POSTGRES_PASSWORD}@db:5432/cocok?sslmode=disable
      SERVER_ADDR: ":8080"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_LEVEL: info
    ports:
      - "8081:8080"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"

volumes:
  pgdata:
